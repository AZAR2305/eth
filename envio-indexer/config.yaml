# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: envio-indexer
networks:
- id: 11155111
  start_block: 0
  contracts:
  - name: MovieManager
    address:
    - 0x0d9C35FA08D03b1106FceBF0aa097F92C95E8b88
    handler: src/EventHandlers.ts
    events:
    - event: MovieAdded(uint256 indexed movieId, string title, address indexed owner)
    - event: ShowAdded(uint256 indexed showId, uint256 indexed movieId, uint256 showtime, uint256 ticketPrice)
  - name: TicketEscrow
    address:
    - 0x5BAFcCD137A7318e2dd1b3c696A035940e9c09E2
    handler: src/EventHandlers.ts
    events:
    - event: RefundProcessed(uint256 indexed purchaseId, address indexed buyer, uint256 customerAmount, uint256 theaterOwnerAmount)
    - event: TicketPurchased(uint256 indexed purchaseId, uint256 indexed showId, address indexed buyer, uint256 amount, uint256[] seatNumbers)

# Enable transaction field selection to access transaction hash
field_selection:
  transaction_fields:
    - "hash"

unordered_multichain_mode: true
preload_handlers: true

# Enable transaction field selection to access transaction hash
